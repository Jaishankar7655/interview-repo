# deploy/nginx.conf  (Nginx site template)
#
# The __APP_DIR__ and __SERVER_NAME__ placeholders are filled in automatically
# by deploy.sh, which writes the result to
# /etc/nginx/sites-available/school-app and enables it.
#
# Flow:  Browser --> Nginx (:80) --> Gunicorn (127.0.0.1:8000) --> Django
# Nginx also serves /static/ and /media/ directly from disk.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Allow reasonably large uploads (e.g. student photos).
    client_max_body_size 25M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias __APP_DIR__/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias __APP_DIR__/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
