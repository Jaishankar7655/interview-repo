server {
    listen 80;
    server_name 34.229.200.54;

    # Static files (collected by 'python manage.py collectstatic')
    location /static/ {
        alias /var/www/school-app/staticfiles/;
    }

    # Media files (student/teacher photos)
    location /media/ {
        alias /var/www/school-app/media/;
    }

    # Pass all other requests to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
